[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt-linked-list"
version = "1.1.0"
authors = [
    { name="Marcus E. Turnbo", email="marcus@emarcus.com" },
]
description = "A linked list module."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools]
py-modules = ["exceptions"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
